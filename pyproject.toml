[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jittor-ultrasound-classification"
version = "0.1.0"
description = "National Rank 7 solution for Jittor AI Algorithm Challenge ultrasound image classification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "albumentations",
  "jittor==1.3.9.14",
  "numpy",
  "pandas",
  "pillow",
  "tqdm",
]
